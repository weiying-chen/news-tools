[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-tools"
version = "0.1.0"
description = "News generation, review, and VO timestamp tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.2,<2",
]

[project.scripts]
setup-news = "setup_news:main"

[tool.setuptools]
py-modules = ["setup_news", "timestamp_vo"]
